# Alembic configuration.
# The database URL is intentionally NOT set here — env.py reads it from application settings
# (the DATABASE_URL env var), so migrations and the app never disagree about where the DB is.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Version filenames get a zero-padded counter + slug, e.g. 0001_domain_core.py.
file_template = %%(rev)s_%%(slug)s
# Store timestamps in migrations as UTC.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
