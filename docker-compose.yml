# Full local stack: Postgres + Redis + the API, with migrations applied before the API starts.
# This is the "one command" developer environment:  docker compose up --build
#
# It mirrors what CI does (real Postgres and Redis, migrations as a separate step) so a green
# stack here means the same shape runs in the pipeline. For production see docker-compose.prod.yml.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, not just on the port being open.
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
    image: appointments-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://aurora:aurora@db:5432/aurora
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    image: appointments-api:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://aurora:aurora@db:5432/aurora
      REDIS_URL: redis://redis:6379/0
      # Local-only secret; production must override this (see docker-compose.prod.yml).
      JWT_SECRET: dev-only-insecure-change-me
      # Passed through so the nightly load test can disable the limiter for its run (otherwise every
      # virtual user shares one principal and the fixed window turns the run into 429s).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
