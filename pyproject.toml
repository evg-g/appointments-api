[project]
name = "appointments-api"
version = "0.1.0"
description = "Aurora Clinic appointment scheduling and cold-chain monitoring API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "evgmongo-maker" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<25",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "freezegun>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appointments_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# A curated set: pycodestyle/pyflakes, bugbear, imports, comprehensions,
# pyupgrade, simplify, and async-correctness. Expanded in later milestones.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src/appointments_api"]

[tool.coverage.report]
show_missing = true
skip_covered = false
