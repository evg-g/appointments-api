[project]
name = "appointments-api"
version = "0.1.0"
description = "Aurora Clinic appointment scheduling and cold-chain monitoring API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "evgmongo-maker" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<25",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2024.2",
    "pyjwt>=2.9,<3",
    "argon2-cffi>=23.1,<24",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "pytest-xdist>=3.6,<4",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "freezegun>=1.5,<2",
    "testcontainers[postgres,redis]>=4.8,<5",
    "polyfactory>=2.17,<3",
    "fakeredis>=2.25,<3",
    "respx>=0.21,<0.22",
    # Milestone 5: property-based, security, and mutation testing.
    "hypothesis>=6.112,<7",
    "schemathesis>=3.36,<4",
    "mutmut>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appointments_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# mutmut writes a mutated copy of the tree here; never lint or format it.
extend-exclude = ["mutants"]

[tool.ruff.lint]
# A curated set: pycodestyle/pyflakes, bugbear, imports, comprehensions,
# pyupgrade, simplify, and async-correctness. Expanded in later milestones.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests"]
exclude = ["^mutants/"]

[[tool.mypy.overrides]]
# testcontainers ships no type information.
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fakeredis ships no type information; respx's stubs are incomplete.
module = ["fakeredis.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# schemathesis and mutmut ship no (complete) type information.
module = ["schemathesis.*", "mutmut.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "property: property-based tests (hypothesis / Schemathesis).",
    "security: security tests (authz matrix, JWT tampering, injection, mass-assignment).",
]

[tool.coverage.run]
branch = true
source = ["src/appointments_api"]
# SQLAlchemy's async engine runs ORM calls across greenlet switches; without this, coverage
# mis-attributes lines executed inside async request handlers.
concurrency = ["greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
# Mutation testing is scoped to the pure business logic in services/ (spec milestone 5). The whole
# package is copied so the mutated code can still import its siblings (enums, models, ...), but only
# files under services/ are actually mutated. The fast, I/O-free unit tests are the runner: mutants
# must be killed by logic tests, not by slow container-backed integration. The baseline kill rate is
# documented in docs/TESTING.md and enforced by scripts/check_mutation.py.
source_paths = ["src/appointments_api"]
only_mutate = ["*/appointments_api/services/*"]
pytest_add_cli_args_test_selection = ["tests/unit"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
